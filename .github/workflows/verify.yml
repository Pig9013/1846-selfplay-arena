name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Python syntax
        run: python -m py_compile server.py verify_all.py audit/log_audit.py train/*.py tests/*.py
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Ruby syntax
        run: |
          for f in arena.rb engine_boot.rb verify_game.rb p1846/*.rb audit/*.rb; do
            ruby -c "$f" > /dev/null && echo "ok $f"
          done
      - name: Revenue auditor unit test
        run: python tests/test_audit.py
